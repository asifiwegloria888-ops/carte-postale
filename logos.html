<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo – Agence événementielle</title>

  <!-- Polices (si pas d'internet, des polices de secours sont utilisées) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="logos.css">
</head>
<body>

  <!-- ============ VERSION FOND CLAIR ============ -->
  <section class="zone zone-claire">

    <div class="logo">

      <!-- Emblème rond -->
     <div class="embleme">
  <svg class="fleur" viewBox="0 0 100 100" aria-hidden="true">

    <!-- Feuilles (derrière la fleur) -->
    <path class="feuille" d="M50 86 C38 86 27 78 24 66 C37 66 47 74 50 86 Z"/>
    <path class="feuille" d="M50 86 C62 86 73 78 76 66 C63 66 53 74 50 86 Z"/>

    <!-- 6 pétales placés en cercle autour du centre -->
    <g transform="translate(50 40)">
      <ellipse class="petale" cx="0" cy="-15" rx="8.5" ry="15"/>
      <ellipse class="petale" cx="0" cy="-15" rx="8.5" ry="15" transform="rotate(60)"/>
      <ellipse class="petale" cx="0" cy="-15" rx="8.5" ry="15" transform="rotate(120)"/>
      <ellipse class="petale" cx="0" cy="-15" rx="8.5" ry="15" transform="rotate(180)"/>
      <ellipse class="petale" cx="0" cy="-15" rx="8.5" ry="15" transform="rotate(240)"/>
      <ellipse class="petale" cx="0" cy="-15" rx="8.5" ry="15" transform="rotate(300)"/>
    </g>

    <!-- Cœur de la fleur -->
    <circle class="coeur" cx="50" cy="40" r="6"/>
  </svg>
</div>

      <!-- Texte : changez le nom de l'agence ici -->
      <div class="texte">
        <h1 class="nom">BEAUTY FLOWERS</h1>
        <p class="sous-nom">AGENCY</p>
        <hr class="trait">
        <p class="mention">Agence événementielle · Goma</p>
      </div>

    </div>

  </section>

  <!-- ============ VERSION FOND SOMBRE ============ -->
  <section class="zone zone-sombre">

    <div class="logo sombre">

      <div class="logo">

      <!-- Emblème rond -->
      <div class="embleme">
  <svg class="fleur" viewBox="0 0 100 100" aria-hidden="true">

    <!-- Feuilles (derrière la fleur) -->
    <path class="feuille" d="M50 86 C38 86 27 78 24 66 C37 66 47 74 50 86 Z"/>
    <path class="feuille" d="M50 86 C62 86 73 78 76 66 C63 66 53 74 50 86 Z"/>

    <!-- 6 pétales placés en cercle autour du centre -->
    <g transform="translate(50 40)">
      <ellipse class="petale" cx="0" cy="-15" rx="8.5" ry="15"/>
      <ellipse class="petale" cx="0" cy="-15" rx="8.5" ry="15" transform="rotate(60)"/>
      <ellipse class="petale" cx="0" cy="-15" rx="8.5" ry="15" transform="rotate(120)"/>
      <ellipse class="petale" cx="0" cy="-15" rx="8.5" ry="15" transform="rotate(180)"/>
      <ellipse class="petale" cx="0" cy="-15" rx="8.5" ry="15" transform="rotate(240)"/>
      <ellipse class="petale" cx="0" cy="-15" rx="8.5" ry="15" transform="rotate(300)"/>
    </g>

    <!-- Cœur de la fleur -->
    <circle class="coeur" cx="50" cy="40" r="6"/>
  </svg>
</div>

      <div class="texte">
        <h1 class="nom">BEAUTY FLOWERS</h1>
        <p class="sous-nom">AGENCY</p>
        <hr class="trait">
        <p class="mention">Agence événementielle · Goma</p>
      </div>

    </div>

  </section>

</body>
</html>
