    <figure class="photo coeur">
      <img src="images/p3.jpeg" alt="Nous deux">

      <p><span class="fort">Joyeux anniversaire, ma princesse !</span> Que notre amour continue de grandir et nous rapproche de notre merveilleux avenir.</p>

    <p class="avec-amour">Avec tout mon amour,</p>
